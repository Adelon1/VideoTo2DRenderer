<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: white;
    }

    #calculator {
      width: 100%;
      height: 100%;
    }

    #miniControls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 20;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .miniButton {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid #bbb;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    #toolbar {
      position: fixed;
      top: 52px;
      left: 10px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 8px;
      display: none;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      max-width: 460px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    #toolbar.open {
      display: flex;
    }

    button {
      cursor: pointer;
    }

    #status {
      font-size: 13px;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div id="miniControls">
    <button id="toggleToolbar" class="miniButton" title="Open controls">▶</button>
    <button id="quickReload" class="miniButton" title="Reload frame">↻</button>
  </div>

  <div id="toolbar">
    <button id="loadFrame">Load Frame</button>
    <button id="clearFrame">Clear</button>
    <button id="fitFrame">Fit Frame</button>
    <button id="saveDefaultView">Save View as Default</button>
    <button id="clearDefaultView">Clear Default View</button>
    <button id="hideToolbar">Hide</button>
    <span id="status">Idle</span>
  </div>

  <div id="calculator"></div>

  <script>
    const CURRENT_FRAME_JSON = "./current_frame.json";
    const DEFAULT_VIEW_KEY = "VideoTo2DRenderer.defaultViewport";

    const calculatorElement = document.getElementById("calculator");
    const toolbar = document.getElementById("toolbar");
    const toggleToolbarButton = document.getElementById("toggleToolbar");
    const status = document.getElementById("status");

    let calculator = null;
    let calculatorOptionsKey = null;
    let lastFrameViewport = null;

    function normalizeSettings(settings) {
      return {
        show_grid: settings?.show_grid ?? false,
        show_axes: settings?.show_axes ?? false,
        show_expressions: settings?.show_expressions ?? false
      };
    }

    function makeOptionsKey(settings) {
      return JSON.stringify({
        show_expressions: settings.show_expressions
      });
    }

    function ensureCalculator(settings) {
      const optionsKey = makeOptionsKey(settings);

      if (calculator && calculatorOptionsKey === optionsKey) {
        return;
      }

      calculatorElement.innerHTML = "";

      calculator = Desmos.GraphingCalculator(calculatorElement, {
        expressions: settings.show_expressions,
        expressionsTopbar: settings.show_expressions,
        settingsMenu: false,
        zoomButtons: false,
        lockViewport: false,
        border: false
      });

      calculatorOptionsKey = optionsKey;
    }

    function applyGraphSettings(settings) {
      calculator.updateSettings({
        showGrid: settings.show_grid,
        showXAxis: settings.show_axes,
        showYAxis: settings.show_axes,
        xAxisNumbers: settings.show_axes,
        yAxisNumbers: settings.show_axes
      });
    }

    async function loadFrame() {
      try {
        status.textContent = "Loading...";

        const response = await fetch(CURRENT_FRAME_JSON + "?time=" + Date.now());

        if (!response.ok) {
          throw new Error("Could not load current_frame.json");
        }

        const data = await response.json();
        const settings = normalizeSettings(data.settings);

        ensureCalculator(settings);

        calculator.setBlank();
        applyGraphSettings(settings);

        lastFrameViewport = data.viewport || null;

        calculator.setExpressions(data.expressions || []);

        applyBestViewport();

        status.textContent =
          "Frame " + (data.frame_number ?? "?") +
          " · " + (data.expressions || []).length + " expressions";
      } catch (error) {
        console.error(error);
        status.textContent = "Error loading frame";
      }
    }

    function applyBestViewport() {
      const savedViewport = getSavedViewport();

      if (savedViewport) {
        calculator.setMathBounds(savedViewport);
        return;
      }

      if (lastFrameViewport) {
        calculator.setMathBounds(lastFrameViewport);
      }
    }

    function fitFrame() {
      if (!calculator || !lastFrameViewport) {
        status.textContent = "No frame viewport loaded";
        return;
      }

      calculator.setMathBounds(lastFrameViewport);
      status.textContent = "Fitted to frame";
    }

    function saveDefaultView() {
      if (!calculator) {
        status.textContent = "No calculator loaded";
        return;
      }

      const bounds = calculator.graphpaperBounds.mathCoordinates;

      const viewport = {
        left: bounds.left,
        right: bounds.right,
        bottom: bounds.bottom,
        top: bounds.top
      };

      localStorage.setItem(DEFAULT_VIEW_KEY, JSON.stringify(viewport));

      status.textContent = "Saved current view as default";
    }

    function clearDefaultView() {
      localStorage.removeItem(DEFAULT_VIEW_KEY);
      status.textContent = "Cleared saved default view";

      if (lastFrameViewport && calculator) {
        calculator.setMathBounds(lastFrameViewport);
      }
    }

    function getSavedViewport() {
      const raw = localStorage.getItem(DEFAULT_VIEW_KEY);

      if (!raw) {
        return null;
      }

      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function toggleToolbar() {
      toolbar.classList.toggle("open");

      if (toolbar.classList.contains("open")) {
        toggleToolbarButton.textContent = "▼";
        toggleToolbarButton.title = "Close controls";
      } else {
        toggleToolbarButton.textContent = "▶";
        toggleToolbarButton.title = "Open controls";
      }
    }

    document.getElementById("toggleToolbar").onclick = toggleToolbar;
    document.getElementById("quickReload").onclick = loadFrame;
    document.getElementById("loadFrame").onclick = loadFrame;
    document.getElementById("fitFrame").onclick = fitFrame;
    document.getElementById("saveDefaultView").onclick = saveDefaultView;
    document.getElementById("clearDefaultView").onclick = clearDefaultView;
    document.getElementById("hideToolbar").onclick = toggleToolbar;

    document.getElementById("clearFrame").onclick = function () {
      if (calculator) {
        calculator.setBlank();
      }

      status.textContent = "Cleared";
    };

    // Press H to hide/show the toolbar.
    // Press R to reload the current frame.
    window.addEventListener("keydown", function (event) {
      if (event.key.toLowerCase() === "h") {
        toggleToolbar();
      }

      if (event.key.toLowerCase() === "r") {
        loadFrame();
      }
    });

    loadFrame();
  </script>
</body>
</html>
