<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: white;
    }

    #calculator {
      width: 100%;
      height: 100%;
    }

    #miniControls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 20;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .miniButton {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid #bbb;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    #toolbar {
      position: fixed;
      top: 52px;
      left: 10px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 8px;
      display: none;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      max-width: 520px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    #toolbar.open {
      display: flex;
    }

    body.screenshot-mode #miniControls,
    body.screenshot-mode #toolbar {
      display: none !important;
    }

    button {
      cursor: pointer;
    }

    #status {
      font-size: 13px;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div id="miniControls">
    <button id="toggleToolbar" class="miniButton" title="Open controls">▶</button>
    <button id="quickReload" class="miniButton" title="Reload frame">↻</button>
  </div>

  <div id="toolbar">
    <button id="loadFrame">Load Frame</button>
    <button id="clearFrame">Clear</button>
    <button id="fitFrame">Fit Frame</button>
    <button id="saveDefaultView">Save View as Default</button>
    <button id="clearDefaultView">Clear Default View</button>
    <button id="testScreenshot">Test Screenshot</button>
    <button id="hideToolbar">Hide</button>
    <span id="status">Idle</span>
  </div>

  <div id="calculator"></div>

  <script>
    const CURRENT_FRAME_JSON = "./current_frame.json";
    const DEFAULT_VIEW_KEY = "VideoTo2DRenderer.defaultViewport";

    const calculatorElement = document.getElementById("calculator");
    const toolbar = document.getElementById("toolbar");
    const toggleToolbarButton = document.getElementById("toggleToolbar");
    const status = document.getElementById("status");

    let calculator = null;
    let calculatorOptionsKey = null;
    let lastFrameData = null;
    let lastFrameViewport = null;

    window.__V2D_RENDER_DONE = false;
    window.__V2D_RENDER_FRAME = null;
    window.__V2D_RENDER_ERROR = null;
    window.__V2D_RENDER_STAGE = "idle";

    function normalizeSettings(settings) {
      return {
        show_grid: settings?.show_grid ?? false,
        show_axes: settings?.show_axes ?? false,
        show_expressions: settings?.show_expressions ?? false
      };
    }

    function makeOptionsKey(settings) {
      return JSON.stringify({
        show_expressions: settings.show_expressions
      });
    }

    function ensureCalculator(settings) {
      const optionsKey = makeOptionsKey(settings);

      if (calculator && calculatorOptionsKey === optionsKey) {
        return;
      }

      calculatorElement.innerHTML = "";

      calculator = Desmos.GraphingCalculator(calculatorElement, {
        expressions: settings.show_expressions,
        expressionsTopbar: settings.show_expressions,
        settingsMenu: false,
        zoomButtons: false,
        lockViewport: false,
        border: false
      });

      calculatorOptionsKey = optionsKey;
    }

    function applyGraphSettings(settings) {
      calculator.updateSettings({
        showGrid: settings.show_grid,
        showXAxis: settings.show_axes,
        showYAxis: settings.show_axes,
        xAxisNumbers: settings.show_axes,
        yAxisNumbers: settings.show_axes
      });
    }

    async function loadFrame() {
      window.__V2D_RENDER_DONE = false;
      window.__V2D_RENDER_FRAME = null;
      window.__V2D_RENDER_ERROR = null;
      window.__V2D_RENDER_STAGE = "loading-json";

      try {
        status.textContent = "Loading...";

        const response = await fetch(CURRENT_FRAME_JSON + "?time=" + Date.now());

        if (!response.ok) {
          throw new Error("Could not load current_frame.json");
        }

        const data = await response.json();
        const settings = normalizeSettings(data.settings);

        window.__V2D_RENDER_STAGE = "creating-calculator";

        ensureCalculator(settings);

        calculator.setBlank();
        applyGraphSettings(settings);

        lastFrameData = data;
        lastFrameViewport = data.viewport || null;

        window.__V2D_RENDER_STAGE = "setting-expressions";

        calculator.setExpressions(data.expressions || []);

        applyBestViewport();

        window.__V2D_RENDER_FRAME = data.frame_number ?? null;
        window.__V2D_RENDER_STAGE = "ready-for-async-screenshot";
        window.__V2D_RENDER_DONE = true;

        status.textContent =
          "Frame " + (data.frame_number ?? "?") +
          " · " + (data.expressions || []).length + " expressions";

        return true;
      } catch (error) {
        console.error(error);
        window.__V2D_RENDER_ERROR = String(error);
        window.__V2D_RENDER_DONE = false;
        window.__V2D_RENDER_STAGE = "error";
        status.textContent = "Error loading frame";
        return false;
      }
    }

    function getCurrentScreenshotMathBounds() {
      const savedViewport = getSavedViewport();

      if (savedViewport) {
        return savedViewport;
      }

      if (lastFrameViewport) {
        return lastFrameViewport;
      }

      return calculator.graphpaperBounds.mathCoordinates;
    }

    function buildScreenshotOptions() {
      const screenshot = lastFrameData?.screenshot || {};

      return {
        format: screenshot.format ?? "png",
        width: screenshot.width ?? 1920,
        height: screenshot.height ?? 1080,
        targetPixelRatio: screenshot.target_pixel_ratio ?? 1,
        mode: screenshot.mode ?? "stretch",
        mathBounds: getCurrentScreenshotMathBounds(),
        showMovablePoints: screenshot.show_movable_points ?? false,
        showLabels: screenshot.show_labels ?? false
      };
    }

    async function captureCurrentFrameScreenshot() {
      if (!calculator) {
        throw new Error("Calculator is not initialized.");
      }

      if (!lastFrameData) {
        throw new Error("No frame data has been loaded.");
      }

      window.__V2D_RENDER_STAGE = "async-screenshot";

      const options = buildScreenshotOptions();

      return new Promise((resolve, reject) => {
        try {
          calculator.asyncScreenshot(options, function (dataUri) {
            if (!dataUri) {
              reject(new Error("Desmos asyncScreenshot returned empty data."));
              return;
            }

            window.__V2D_RENDER_STAGE = "screenshot-complete";
            resolve(dataUri);
          });
        } catch (error) {
          window.__V2D_RENDER_ERROR = String(error);
          window.__V2D_RENDER_STAGE = "screenshot-error";
          reject(error);
        }
      });
    }

    async function testScreenshot() {
      try {
        status.textContent = "Capturing screenshot...";

        const dataUri = await captureCurrentFrameScreenshot();

        const tab = window.open();
        tab.document.write(`<img src="${dataUri}" style="max-width: 100%; height: auto;">`);

        status.textContent = "Screenshot opened";
      } catch (error) {
        console.error(error);
        status.textContent = "Screenshot failed";
      }
    }

    function applyBestViewport() {
      const savedViewport = getSavedViewport();

      if (savedViewport) {
        calculator.setMathBounds(savedViewport);
        return;
      }

      if (lastFrameViewport) {
        calculator.setMathBounds(lastFrameViewport);
      }
    }

    function fitFrame() {
      if (!calculator || !lastFrameViewport) {
        status.textContent = "No frame viewport loaded";
        return;
      }

      calculator.setMathBounds(lastFrameViewport);
      status.textContent = "Fitted to frame";
    }

    function saveDefaultView() {
      if (!calculator) {
        status.textContent = "No calculator loaded";
        return;
      }

      const bounds = calculator.graphpaperBounds.mathCoordinates;

      const viewport = {
        left: bounds.left,
        right: bounds.right,
        bottom: bounds.bottom,
        top: bounds.top
      };

      localStorage.setItem(DEFAULT_VIEW_KEY, JSON.stringify(viewport));

      status.textContent = "Saved current view as default";
    }

    function clearDefaultView() {
      localStorage.removeItem(DEFAULT_VIEW_KEY);
      status.textContent = "Cleared saved default view";

      if (lastFrameViewport && calculator) {
        calculator.setMathBounds(lastFrameViewport);
      }
    }

    function getSavedViewport() {
      const raw = localStorage.getItem(DEFAULT_VIEW_KEY);

      if (!raw) {
        return null;
      }

      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function toggleToolbar() {
      toolbar.classList.toggle("open");

      if (toolbar.classList.contains("open")) {
        toggleToolbarButton.textContent = "▼";
        toggleToolbarButton.title = "Close controls";
      } else {
        toggleToolbarButton.textContent = "▶";
        toggleToolbarButton.title = "Open controls";
      }
    }

    function setScreenshotMode(enabled) {
      document.body.classList.toggle("screenshot-mode", enabled);
    }

    window.loadFrame = loadFrame;
    window.fitFrame = fitFrame;
    window.setScreenshotMode = setScreenshotMode;
    window.captureCurrentFrameScreenshot = captureCurrentFrameScreenshot;

    document.getElementById("toggleToolbar").onclick = toggleToolbar;
    document.getElementById("quickReload").onclick = loadFrame;
    document.getElementById("loadFrame").onclick = loadFrame;
    document.getElementById("fitFrame").onclick = fitFrame;
    document.getElementById("saveDefaultView").onclick = saveDefaultView;
    document.getElementById("clearDefaultView").onclick = clearDefaultView;
    document.getElementById("testScreenshot").onclick = testScreenshot;
    document.getElementById("hideToolbar").onclick = toggleToolbar;

    document.getElementById("clearFrame").onclick = function () {
      if (calculator) {
        calculator.setBlank();
      }

      status.textContent = "Cleared";
    };

    window.addEventListener("keydown", function (event) {
      if (event.key.toLowerCase() === "h") {
        toggleToolbar();
      }

      if (event.key.toLowerCase() === "r") {
        loadFrame();
      }
    });

    loadFrame();
  </script>
</body>
</html>
